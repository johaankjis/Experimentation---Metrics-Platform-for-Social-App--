# Experimentation Platform Configuration
# Defines experiments, metrics, and platform settings

platform:
  name: "Experimentation Platform"
  version: "1.0.0"
  environment: "production"
  
  # Statistical settings
  statistical_settings:
    default_alpha: 0.05
    default_confidence_level: 0.95
    default_power: 0.80
    multiple_testing_correction: "benjamini_hochberg"  # or "bonferroni"
    
  # Assignment settings
  assignment:
    hash_salt: "experimentation_platform_v1"
    enable_multi_experiment: true
    max_concurrent_experiments: 10

# Active Experiments
experiments:
  - experiment_id: "homepage_redesign_v1"
    name: "Homepage Redesign Test"
    description: "Testing new homepage layout with improved CTA placement"
    status: "active"
    start_date: "2025-01-15"
    end_date: "2025-02-15"
    
    variants:
      - name: "control"
        description: "Current homepage design"
        traffic_allocation: 0.5
      
      - name: "treatment"
        description: "New homepage with prominent CTA"
        traffic_allocation: 0.5
    
    primary_metrics:
      - "conversion_rate"
      - "revenue_per_user"
    
    guardrail_metrics:
      - "page_load_time"
      - "error_rate"
    
    diagnostic_metrics:
      - "session_duration"
      - "bounce_rate"
  
  - experiment_id: "checkout_flow_v2"
    name: "Simplified Checkout Flow"
    description: "Testing streamlined checkout with fewer steps"
    status: "active"
    start_date: "2025-01-20"
    end_date: "2025-02-20"
    
    variants:
      - name: "control"
        description: "Current 3-step checkout"
        traffic_allocation: 0.4
      
      - name: "treatment_2step"
        description: "Simplified 2-step checkout"
        traffic_allocation: 0.3
      
      - name: "treatment_1page"
        description: "Single-page checkout"
        traffic_allocation: 0.3
    
    primary_metrics:
      - "conversion_rate"
      - "revenue_per_user"
    
    guardrail_metrics:
      - "error_rate"

# Metric Definitions
metrics:
  north_star:
    - metric_id: "revenue_per_user"
      minimum_sample_size: 1000
      minimum_detectable_effect: 0.05
    
    - metric_id: "conversion_rate"
      minimum_sample_size: 500
      minimum_detectable_effect: 0.02
  
  guardrails:
    - metric_id: "page_load_time"
      threshold: 0.10  # 10% degradation threshold
      minimum_sample_size: 500
    
    - metric_id: "error_rate"
      threshold: 0.05  # 5% degradation threshold
      minimum_sample_size: 1000

# Data Pipeline Settings
data_pipeline:
  source_database: "analytics_db"
  experiment_events_table: "experiment_events"
  user_metrics_table: "user_metrics"
  
  # Airflow DAG settings
  airflow:
    dag_schedule: "0 2 * * *"  # Daily at 2 AM
    retry_attempts: 3
    retry_delay_minutes: 5
    email_on_failure: true
    alert_emails:
      - "data-team@company.com"

# Dashboard Settings
dashboard:
  refresh_interval_seconds: 300
  default_date_range_days: 30
  enable_real_time_updates: true
  
  # Visualization settings
  charts:
    default_chart_type: "line"
    show_confidence_intervals: true
    highlight_significance: true
